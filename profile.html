<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member profile · Ravent Care</title><link rel="icon" type="image/svg+xml" href="logo.svg">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--s1:#fff;--s2:#f3f7fc;--line:#d6e2f0;--tx:#10233f;--mut:#4d6180;--ac:#1f6fd1;--ok:#0f7a4f;--okb:#e2f5ec;--bad:#b42318;--badb:#fdecea}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font-family:Satoshi,system-ui,sans-serif;min-height:100vh}
.top{background:#fff;border-bottom:1px solid var(--line)}.top .in{max-width:1080px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;text-decoration:none;color:var(--tx)}.brand img{width:28px;height:28px}
.top nav{margin-left:auto;display:flex;gap:14px;font-size:14px}.top nav a{color:var(--mut);text-decoration:none}.top nav a:hover{color:var(--ac)}
main{max-width:1080px;margin:auto;padding:26px 20px 60px}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;font-weight:900}h2{font-size:18px;font-weight:700;margin-bottom:10px}h3{font-size:15px;font-weight:700;margin:0 0 8px}
.mut{color:var(--mut)}.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px}
.lay{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:22px;align-items:start}
@media(max-width:860px){.lay{grid-template-columns:1fr}}
.pt{display:grid;gap:8px}.pt button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--tx);cursor:pointer}
.pt button:hover{border-color:var(--ac)}.pt button.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset;background:#fff}
.pt b{display:block;font-size:15px}.pt small{color:var(--mut);font-size:12.5px}
.go{width:100%;margin-top:14px;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}.go:disabled{opacity:.6;cursor:wait}
.banner{font-size:13px;background:#fff7e6;border:1px solid #f4d9a6;color:#7a4b00;border-radius:12px;padding:10px 12px;margin-top:14px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px}.status.ok{background:var(--okb);color:var(--ok)}.status.no{background:var(--badb);color:var(--bad)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}@media(max-width:560px){.kp{grid-template-columns:1fr}}
.k{background:var(--s2);border-radius:14px;padding:14px}.k .l{font-size:12.5px;color:var(--mut)}.k .v{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:2px}.k .v small{font-size:14px;color:var(--mut);font-weight:500}
.bar{height:8px;background:#dfe9f5;border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.k .s{font-size:12.5px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.net{font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;background:#e3eefc;color:var(--ac)}.net.out{background:#fdf0e3;color:#9a4a00}
.empty{text-align:center;padding:50px 20px}.empty svg{width:56px;height:56px;color:var(--ac);opacity:.5;margin-bottom:10px}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,#e8eff8,#f5f8fc,#e8eff8);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
.foot{font-size:12px;color:var(--mut);margin-top:18px;line-height:1.5}
.err{background:var(--badb);color:var(--bad);border-radius:12px;padding:12px;font-size:14px}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--ac);font-weight:700;font-size:14px;text-decoration:none;margin-bottom:14px}
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.av{width:64px;height:64px;border-radius:50%;background:#e3eefc;color:var(--ac);display:grid;place-items:center;font-weight:900;font-size:24px;flex:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}.f{background:var(--s2);border-radius:12px;padding:10px 12px}.f .l{font-size:12px;color:var(--mut)}.f .v{font-weight:700;font-size:14.5px;margin-top:2px;word-break:break-word}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}@media(max-width:860px){.g2{grid-template-columns:1fr}}
.sec{margin-top:18px}.list{display:grid;gap:8px}.it{background:var(--s2);border-radius:12px;padding:10px 12px;font-size:14px}.it b{display:block}.it .m{color:var(--mut);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;background:#fff;color:var(--tx)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
details.svc{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;overflow:hidden}details.svc summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}details.svc summary::-webkit-details-marker{display:none}
details.svc summary .c{font-weight:500;color:var(--mut);font-size:13px;white-space:nowrap}details.svc summary:after{content:"+";color:var(--ac);font-weight:900;margin-left:8px}details.svc[open] summary:after{content:"–"}
.rw{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}.rw .val{font-weight:900;text-align:right;white-space:nowrap}.rw .meta{grid-column:1/-1;color:var(--mut);font-size:12.5px;line-height:1.45}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;margin:0 4px 2px 0;background:#eef2f7;color:var(--mut)}.tg.in{background:#e3eefc;color:var(--ac)}.tg.out{background:#fdf0e3;color:#9a4a00}.tg.au{background:#fdecea;color:var(--bad)}
@media print{.top,.back,.tools,.confirm{display:none}details.svc{break-inside:avoid}}
</style></head><body>
<div class="top"><div class="in"><a class="brand" href="https://raventcare.com/"><img src="logo.svg" alt="">Ravent <span style="color:var(--ac)">Care</span></a>
<nav><a href="https://raventcare.com/">App</a><a href="https://raventcare.com/find.html">Find a doctor</a><a href="https://raventcare.com/privacy.html">Privacy</a></nav></div></div>
<main>
<a class="back" id="back" href="benefits.html">← Back to Check my benefits</a>
<div id="app"><div class="card"><div class="sk" style="width:40%;height:26px"></div><div class="sk"></div><div class="sk" style="height:90px"></div></div></div>
</main>
<script>
const API=/pplx\.app$/.test(location.hostname)?"__PORT_5000__":"https://raventcare-benefits.pplx.app/port/5000";
if(/pplx\.app$/.test(location.hostname))document.getElementById("back").href="./";
const $=id=>document.getElementById(id);
const usd=v=>v==null?"—":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:2});
const dt=s=>{if(!s)return null;const m=String(s).match(/^(\d{4})(\d{2})(\d{2})(?:-(\d{4})(\d{2})(\d{2}))?$/);if(!m)return String(s);const f=(y,mo,d)=>new Date(+y,+mo-1,+d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});return m[4]?f(m[1],m[2],m[3])+" – "+f(m[4],m[5],m[6]):f(m[1],m[2],m[3])};
const age=s=>{if(!s||s.length<8)return null;const b=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>{s=String(s||"");return s===s.toUpperCase()?s.charAt(0)+s.slice(1).toLowerCase():s};
const fact=(l,v)=>v?`<div class="f"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`:"";
function pick(o,lvl){for(const n of["in","any","out"]){const t=o[`${n}_${lvl}_total`],r=o[`${n}_${lvl}_remaining`];if(t!=null||r!=null)return{t,r,n}}return null}
function kpi(label,o){const i=pick(o||{},"individual"),f=pick(o||{},"family"),x=i||f;if(!x)return`<div class="k"><div class="l">${label}</div><div class="v">—</div><div class="s">Not reported by this insurer</div></div>`;let met=null;if(x.t!=null&&x.r!=null&&x.t>0&&x.r<=x.t)met=x.t-x.r;
 return`<div class="k"><div class="l">${label} · ${i?"individual":"family"}${x.n==="out"?" (out of network)":""}</div><div class="v">${x.t!=null?usd(x.t):usd(x.r)}${x.t!=null?" <small>per year</small>":" <small>left</small>"}</div>${met!=null?`<div class="bar"><i style="width:${Math.round(met/x.t*100)}%"></i></div><div class="s">${usd(x.r)} left · ${usd(met)} met</div>`:""}${f&&i?`<div class="s">Family: ${f.t!=null?usd(f.t):usd(f.r)+" left"}</div>`:""}</div>`}
function val(r){if(r.type==="Non-Covered")return"Not covered";if(r.percent!=null)return r.percent+"%";if(r.amount!=null)return usd(r.amount);if(r.quantity)return r.quantity;if(r.type==="Active Coverage")return"Covered";return"—"}
function row(r){const tags=[r.network==="in"?'<span class="tg in">In network</span>':r.network==="out"?'<span class="tg out">Out of network</span>':"",r.level?`<span class="tg">${esc(r.level)}</span>`:"",r.time?`<span class="tg">${esc(r.time)}</span>`:"",r.auth==="Required"?'<span class="tg au">Prior authorization required</span>':r.auth?`<span class="tg">Authorization ${esc(r.auth.toLowerCase())}</span>`:""].join("");
 const notes=[r.plan,...(r.notes||[])].filter(Boolean).map(cap).map(esc).join(" · ");
 return`<div class="rw" data-n="${esc(r.network||"")}"><div><b>${esc(r.type)}</b></div><div class="val">${esc(val(r))}</div><div class="meta">${tags}${notes?"<div>"+notes+"</div>":""}</div></div>`}
let D=null,NET="all";
function drawSvc(){const q=($("q").value||"").toLowerCase().trim();let shown=0;
 $("svcs").innerHTML=D.services.map((s,i)=>{const rows=s.rows.filter(r=>(NET==="all"||r.network===NET)&&(!q||(s.name+" "+r.type+" "+(r.notes||[]).join(" ")+" "+(r.plan||"")).toLowerCase().includes(q)));if(!rows.length)return"";shown++;
 return`<details class="svc"${i===0&&!q?" open":""}${q?" open":""}><summary><span>${esc(s.name)}</span><span class="c">${rows.length} item${rows.length>1?"s":""}</span></summary>${rows.map(row).join("")}</details>`}).join("")||'<p class="mut" style="font-size:14px">Nothing matches that search.</p>';}
const id=new URLSearchParams(location.search).get("id");
(async()=>{try{if(!id)throw new Error("No member was chosen.");
 const r=await fetch(API+"/api/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)throw new Error(d.error||"The profile couldn't load.");D=d;
 const p=d.person,s=d.summary,a=age(p.dob),ini=(p.name||"?").split(" ").map(x=>x[0]).filter(Boolean);document.title=p.name+" · Member profile · Ravent Care";
 const total=d.services.reduce((n,x)=>n+x.rows.length,0);
 $("app").innerHTML=`<div class="card"><div class="hd" style="margin:0"><div class="ph"><div class="av" aria-hidden="true">${esc((ini[0]||"")+(ini.length>1?ini[ini.length-1]:""))}</div><div><p class="mut" style="font-size:13px">Member profile · ${esc(d.payer.name)}</p><h1 style="font-size:clamp(26px,3.6vw,34px)">${esc(p.name)}</h1><p class="mut" style="font-size:14px">${esc(p.relationship)}</p></div></div>
 <span class="status ${s.active?"ok":"no"}">${s.active?"● Coverage active":"● Coverage not active"}</span></div>
 <div class="facts">${fact("Date of birth",p.dob?dt(p.dob)+(a!=null?" (age "+a+")":""):null)}${fact("Gender",p.gender)}${fact("Member ID",p.memberId)}${fact("Group number",p.groupNumber)}${fact("Plan number",p.planNumber)}${fact("Address on file",p.address)}</div></div>
 ${(s.errors||[]).length?`<div class="err" style="margin-top:14px">${s.errors.map(esc).join("<br>")}</div>`:""}
 <div class="g2"><div class="card"><h2>Plan</h2><div class="facts" style="margin-top:6px">${fact("Plan",d.plan.name||s.plan)}${fact("Plan type",d.plan.type)}${fact("Group",d.plan.groupDescription)}${fact("Insurer",d.payer.name)}${fact("Payer ID",d.payer.payerId)}${d.plan.status.length?fact("Status",[...new Set(d.plan.status)].join(", ")):""}${d.plan.dates.map(x=>fact(x.label,dt(x.value))).join("")}${d.payer.contacts.map(c=>fact(c.type==="Uniform Resource Locator (URL)"?"Insurer website":"Insurer "+c.type.toLowerCase(),c.value.toLowerCase().startsWith("www")?c.value.toLowerCase():c.value)).join("")}</div></div>
 <div class="card"><h2>Costs this year</h2>${s.active?`<div class="kp" style="margin:6px 0 0">${kpi("Deductible",s.deductible)}${kpi("Out-of-pocket max",s.oop)}</div>`:'<p class="mut" style="font-size:14px">The insurer reports this plan is no longer active, so there are no current costs.</p>'}</div></div>
 <div class="g2"><div class="card"><h2>Care team and contacts</h2>${d.related.length?`<div class="list">${d.related.map(e=>`<div class="it"><b>${esc(e.name||e.role)}</b><div class="m">${esc(e.role)}${e.service?" · "+esc(e.service):""}</div>${e.address?`<div class="m">${esc(e.address)}</div>`:""}${e.contacts.map(c=>`<div class="m">${esc(c.type)}: ${esc(c.value)}</div>`).join("")}</div>`).join("")}</div>`:'<p class="mut" style="font-size:14px">The insurer didn\'t list a primary care provider or other contacts.</p>'}</div>
 <div class="card"><h2>Plan limits</h2>${d.limits.length?`<div class="list">${d.limits.map(l=>`<div class="it"><b>${esc(l.what)}</b><div class="m">${esc(l.value)}</div></div>`).join("")}</div>`:'<p class="mut" style="font-size:14px">No age or visit limits were reported.</p>'}</div></div>
 <div class="card sec"><div class="hd" style="margin-bottom:8px"><div><h2 style="margin:0">Every benefit the insurer reported</h2><p class="mut" style="font-size:13px">${total} items across ${d.services.length} types of care</p></div></div>
 <div class="tools"><input id="q" type="search" placeholder="Search benefits, e.g. chiropractic, MRI, copay" aria-label="Search benefits"><button class="chip on" data-net="all">All</button><button class="chip" data-net="in">In network</button><button class="chip" data-net="out">Out of network</button></div>
 <div id="svcs"></div></div>
 <div class="sec">${CONFIRM}</div>
 <p class="foot">Pulled from ${esc(d.payer.name)} through Stedi just now and not stored by Ravent Care. In test mode, these are the insurer's sample answers for a practice patient, not anyone's real coverage.</p>`;
 $("q").oninput=drawSvc;document.querySelectorAll("[data-net]").forEach(b=>b.onclick=()=>{NET=b.dataset.net;document.querySelectorAll("[data-net]").forEach(x=>x.classList.toggle("on",x===b));drawSvc()});drawSvc();
}catch(e){$("app").innerHTML=`<div class="card"><div class="err">${esc(e.message||"The profile couldn't load.")} Go back and pick a member, or try again in a moment.</div></div>`}})();
const CONFIRM=`<div class="confirm" role="note" style="display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:12px 14px;border-radius:12px;background:#fff7ec;border:1px solid #f6d9b5;color:#6b3407;font-size:14px;line-height:1.45;max-width:760px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.5"/></svg><div><b>Always confirm with your insurer.</b> Before any visit, call the member services number on your insurance card, or check your insurer's website, to confirm the provider is in network for your plan. Network lists can be out of date.</div></div>`;
</script></body></html>
